; ESP32-S3-EYE 完整固件（ESP-IDF 工程，由 PlatformIO 驱动 IDF 框架编译）
;
; 背景：本机没有安装 ESP-IDF 本体，改用 PlatformIO 自带的 IDF 框架与工具链。
;   - GitHub 不可达，组件不得走组件管理器；esp32-camera 已本地化到 managed_components/
;   - 若某包下载缓慢，可直连注册表手动取：
;     https://dl.registry.platformio.org/download/<owner>/<type>/<name>/<version>/<file>
;
; 编译： pio run
; 烧录： pio run -t upload -p COM4
[platformio]
src_dir = main
include_dir = main

[env:s3eye]
platform = espressif32@7.1.3
framework = espidf
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
build_flags =
    ; 关闭两个与本工程功能无关、且在 IDF 6 下会因 -Werror 直接中断构建的告警
    -Wno-error=calloc-transposed-args
    -Wno-error=header-guard
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 921600
