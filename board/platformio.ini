; 课程：AI 交互原型与用户体验设计（S2 实验班）
; 板卡：ESP32-S3-EYE（8MB Flash + 8MB Octal PSRAM、OV2640 摄像头、ST7789 LCD、QMA6100P IMU）
; 端口：COM4（ESP32-S3 原生 USB 串口）
; 密钥不入库：Wi-Fi 与服务器地址放 board/src/secrets.h（已 .gitignore）

[platformio]
default_envs = s3eye

[env:s3eye]
platform  = espressif32@7.1.3
board     = esp32s3-eye
board_dir = boards
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DEYE_FW_VERSION=\"w01\"
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
